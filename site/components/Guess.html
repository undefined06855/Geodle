<div class="guess row-compact">
    <!--{{
        console.log("created guess:");
        console.log(params);

        params.addTick = params.addTick ?? true;
    }}-->

    <!--{{
        let parent = document.createElement("div");
        parent.classList.add("overlay");

        let icon = new Image();
        icon.id = "mod-icon";

        if (params.mod.id == "???.???") {
            icon.src = `assets/gd-logo.png`;
        } else {
            icon.src = `https://api.geode-sdk.org/v1/mods/${params.mod.id}/logo`;
        }

        parent.appendChild(icon);

        if (params.mod.id != geodleData.mod.id && params.addTick) {
            parent.appendChild(Cross());
        }

        return parent;
    }}-->

    <div class="col-compact" id="guess-content">
        <div class="row-compact">
            <div class="mod-title">
                <!--{{
                    let anchor = document.createElement("a");
                    anchor.innerText = params.mod.name;
                    if (params.mod.id != "???.???") {
                        anchor.href = `https://geode-sdk.org/mods/${params.mod.id}`;
                    }

                    return anchor;
                }}-->
            </div>

            <div class="mod-id">
                <!--{{ return document.createTextNode(params.mod.id) }}-->
            </div>
        </div>

        <div class="developer">
            <!-- {{
                let parent = document.createElement("div");
                parent.classList.add("overlay");

                let anchor = document.createElement("a");
                anchor.innerText = params.mod.developer;
                if (params.mod.developerID != 0) {
                    anchor.href = `https://geode-sdk.org/developers/${params.mod.developerID}`;
                }

                parent.appendChild(anchor);

                if (params.addTick) {
                    if (params.mod.developer.toLowerCase() != geodleData.mod.developer.toLowerCase()) {
                        parent.appendChild(Cross());
                    } else {
                        parent.appendChild(Tick());
                    }
                }

                return parent;
            }} -->
        </div>

        <!--{{
            let parent = document.createElement("div");
            parent.classList.add("row-compact");
            parent.classList.add("tags");

            for (let tag of params.mod.tags) {
                let child = document.createElement("div");
                child.classList.add("overlay");
                child.classList.add("tag");

                let label = document.createElement("span");
                label.innerText = tag[0].toUpperCase() + tag.slice(1);
                child.appendChild(label);

                if (params.addTick) {
                    if (!geodleData.mod.tags.includes(tag)) {
                        child.appendChild(Cross());
                    } else {
                        child.appendChild(Tick());
                    }
                }

                parent.appendChild(child);
            }

            return parent;
        }}-->
    </div>

    <div class="col-compact right">
        <div class="row-compact">
            <div class="download-icon"></div>
            <!--{{ return abbreviateDownloadCount(params.mod.downloads); }}-->
            <!--{{
                if (geodleData.mod.downloads > params.mod.downloads) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Higher)");
                } else if (geodleData.mod.downloads < params.mod.downloads) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Lower)");
                }
            }}-->
        </div>

        <div class="row-compact">
            <div class="version-icon"></div>
            <!--{{ return document.createTextNode(`v${params.mod.version}`) }}-->
        </div>

        <div class="row-compact">
            <div class="release-icon"></div>
            <!--{{
                return calculateRelativeDate(params.mod.releaseDate);
            }}-->
            <!--{{
                let offset = new Date(params.mod.releaseDate).getTime() - new Date(geodleData.mod.releaseDate).getTime();
                if (offset < 0) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Newer)");
                } else if (offset > 0) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Older)");
                }
            }}-->
        </div>

        <div class="row-compact">
            <div class="update-icon"></div>
            <!--{{
                return calculateRelativeDate(params.mod.updateDate);
            }}-->
            <!--{{
                let offset = new Date(params.mod.updateDate).getTime() - new Date(geodleData.mod.updateDate).getTime();
                if (offset < 0) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Newer)");
                } else if (offset > 0) {
                    return document.createTextNode("&nbsp;&bull;&nbsp;(Older)");
                }
            }}-->
        </div>
    </div>
</div>
